# 富士 (実車スケール) 用の報酬の重み。ミニカー (reward.yaml) の距離をコース幅の比 (15 m / 0.6 m = 25 倍) で伸ばした値。
# 1 判断 (1/15 s) で 200 km/h なら 3.7 m 進む。1 周 4,563 m で前進の報酬は約 46。
reward:
  progress: 0.01         # 1 m ごと
  backward: 2.0          # 後ろに進んだ距離に追加で掛ける (倍率)
  cte_free_m: 3.0        # コース中心からこの距離までは罰しない (幅 15 m の中央 6 m)
  cte: 0.005             # (|横偏差| − cte_free_m)² に掛ける
  wall_margin_m: 1.0     # バリアまでの余裕がこれを割ったら罰
  wall: 0.1
  steer_rate: 0.002      # 舵の変化率² × dt
  time: 0.0005           # 毎 step
  lap_bonus: 5.0
  terminal: 5.0          # バリアに当たる・コース外 (コース端 + 3 m)
