# ML-Agents の学習設定: プロコンで記録した .demo から模倣 (BC) で始め、PPO で最適化する。
#   mlagents-learn tools/mlagents/config/minicar_bc_ppo.yaml --run-id=minicar_bc_ppo_01 \
#       --time-scale=1 --capture-frame-rate=0 --target-frame-rate=60     (docs/mlagents.md)
# demo_path は .demo のファイルかフォルダ (フォルダなら中の .demo を全部使う)。
behaviors:
  MinicarDriver:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: nature_cnn     # 画像 96×96 (-mlres)。36 未満にはしない
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    # 模倣: 方策を人の運転に近づける項。steps のあいだに強さを 0 まで下げ、以降は PPO だけで伸ばす
    behavioral_cloning:
      demo_path: demos     # リポジトリ直下から起動する前提 (Unity の -demodir と同じ場所)
      strength: 0.5
      steps: 150000
      samples_per_update: 0
    max_steps: 1.0e6
    time_horizon: 128
    summary_freq: 5000
    keep_checkpoints: 5
    checkpoint_interval: 50000
