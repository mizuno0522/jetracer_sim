# BC に加えて GAIL (「人の運転らしさ」を判別器で報酬にする) を使う版。デモが数周ぶんしかないときに。
# 報酬の主役は extrinsic (gateway の報酬)。GAIL を強くしすぎると人の癖までまねて速くならない。
behaviors:
  MinicarDriver:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      vis_encode_type: nature_cnn
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      gail:
        gamma: 0.99
        strength: 0.05
        demo_path: demos     # リポジトリ直下から起動する前提 (Unity の -demodir と同じ場所)
        use_actions: true
    behavioral_cloning:
      demo_path: demos     # リポジトリ直下から起動する前提 (Unity の -demodir と同じ場所)
      strength: 0.5
      steps: 150000
    max_steps: 1.0e6
    time_horizon: 128
    summary_freq: 5000
    keep_checkpoints: 5
    checkpoint_interval: 50000
