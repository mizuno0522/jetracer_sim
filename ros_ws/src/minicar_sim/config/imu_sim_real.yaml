# imu_sim の実車スケール版 (course:=fuji と real_*.yaml 用)。sim_host.launch.py がコースで選ぶ。
# ミニカー用 (imu_sim.yaml) との違い: 取付は車体の重心付近・水平、加速度レンジ ±8 g、
# 路面振動は舗装の実車相当 (200 km/h で約 0.7 m/s² rms)、駆動系の振動はエンジン回転相当の低い周波数で小さく。
# 雑音・バイアス・遅れなどセンサそのものの汚れはミニカーと同じ MPU-6500 互換のまま。
imu_sim:
  frame_id: imu_link
  body_state_topic: /sim/body_state
  imu_topic: /imu
  seed: 0
  mount:
    xyz:
    - 1.1
    - 0.0
    - 0.4
    rpy_deg:
    - 0.0
    - 0.0
    - 0.0
    rpy_err_deg:
    - 0.5
    - 0.5
    - 0.5
  rate:
    physics_hz: 100
    internal_hz: 1000
    output_hz: 100
  range:
    accel_g: 8
    gyro_dps: 500
    bits: 16
    saturate: true
  dlpf:
    accel_bw_hz: 94.0
    accel_delay_ms: 3.0
    gyro_bw_hz: 98.0
    gyro_delay_ms: 2.8
  alpha_bw_hz: 30.0
  noise:
    accel_nd: 0.004
    gyro_nd: 9.0e-05
    accel_rw: 0.0004
    gyro_rw: 2.0e-05
  turn_on_bias:
    accel_sigma:
    - 0.08
    - 0.08
    - 0.12
    gyro_sigma:
    - 0.01
    - 0.01
    - 0.01
  scale:
    accel_err_sigma: 0.01
    gyro_err_sigma: 0.01
    misalign_deg_sigma: 0.5
  temp:
    start_c: 25.0
    rise_c: 15.0
    tau_s: 300.0
    accel_coef: 0.002
    gyro_coef: 0.0003
  vibration:
    motor_hz_per_mps: 1.6
    harmonics:
    - 1
    - 2
    - 4
    amp_ms2:
    - 0.06
    - 0.04
    - 0.02
    gear_mesh_hz: 0.0
    gyro_per_ms2: 0.005
    surface:
      carpet:
        rms_per_mps: 0.012
        fc_hz: 30.0
      slope:
        rms_per_mps: 0.012
        fc_hz: 30.0
      turf:
        rms_per_mps: 0.012
        fc_hz: 30.0
      rough:
        rms_per_mps: 0.012
        fc_hz: 30.0
      slip:
        rms_per_mps: 0.012
        fc_hz: 30.0
  latency:
    base_ms: 4.0
    jitter_ms: 2.0
    drop_prob: 0.002
  domain_rand:
    enable: true
    seed_per_episode: true
    scale: 1.0
