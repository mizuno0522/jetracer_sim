# 既存 sim の想定車両 (Tamiya M-05 前輪駆動)。比較用。数値は minicarbattle2026 の sim.yaml から。
vehicle_profile:
  name: m05
  wheelbase_m: 0.210
  track_m: 0.150
  mass_kg: 2.5
  cg_height_m: 0.06
  length_m: 0.40
  width_m: 0.19
  delta_max_rad: 0.42
  v_max_mps: 3.0
  drive: front
  drive_split: [0.60, 0.40]
  gear_ratio: 8.27
  tire_dia_m: 0.060
  motor: {force_n: 6.0, v_free_mps: 6.0, accel_time_constant_s: 0.35}
  servo: {tau_s: 0.06, rate_limit_rad_s: 6.0}
  esc: {type: generic, deadband_mps: 0.05, reverse_via_neutral_ms: 120, brake_decel_mps2: 4.0, coast_decel_mps2: 0.35}
  suspension: {roll_per_ms2: 0.020, pitch_per_ms2: 0.012}
  camera: {width: 320, height: 216, rate_hz: 30.0, hfov_deg: 120.0, mount_height_m: 0.12, mount_x_m: 0.0, pitch_deg: 12.0, crop_top_frac: 0.10, distortion: none}
