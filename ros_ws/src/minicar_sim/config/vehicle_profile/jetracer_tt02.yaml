# JetRacer 機 (Tamiya TT-02 4WD ＋ JetRacer 標準 BOM ＋ Jetson Orin Nano)。
# ★ 車両の数値はここにだけ書く。vehicle_sim / cmd_shaper / jetracer_bridge / Unity 書き出しが同じ値を読む。
# 「寸法は図面から、特性は実測から。推測で埋めない」── ★要実測 の欄は暫定値 (設計書 パラメータ タブ)。
vehicle_profile:
  name: jetracer_tt02
  wheelbase_m: 0.257          # Tamiya 公称。確定
  track_m: 0.157              # ★要確認 (ホイールオフセット次第)
  mass_kg: 1.85               # ★要実測 (Orin Nano ＋ 電源込み、暫定)
  cg_height_m: 0.050          # ★要実測
  length_m: 0.43              # 全長 (ヨー慣性の見積りに使う)
  width_m: 0.19               # 全幅 (規約 220 mm 以内)
  delta_max_rad: 0.47         # ★要実測 (暫定 27°。R_min = 0.257/tan(0.47) = 0.506 m)
  v_max_mps: 3.0              # cmd_shaper の s=1 に対応する車速。実走ログの最速 2.5 m/s より上
  drive: 4wd_locked           # シャフト 4WD・センターデフ無し (既存 sim の想定は front)
  drive_split: [0.5, 0.5]     # 前後の駆動力配分 (拘束下の名目値)
  gear_ratio: 8.35            # 22T ピニオン標準 ★要確認 (ピニオン交換で 5〜11)
  tire_dia_m: 0.064           # ★要実測
  motor:
    force_n: 8.0              # ★要実測: 直線で 0→2.0 m/s の到達時間 t から F = m·2.0/t
    v_free_mps: 4.5           # 駆動力が 0 になる車速 (DC モータの特性) ★要実測
    accel_time_constant_s: 0.35
  servo:
    tau_s: 0.06               # 一次遅れ ★要実測
    rate_limit_rad_s: 6.0     # サーボ追従限界 ★要実測
  esc:
    type: tble_02s
    deadband_mps: 0.15        # 不感帯 (±0.08 相当。実走ログはこの直上の敏感な領域を使っていた) ★要実測
    reverse_via_neutral_ms: 120   # ★後退は中立を経由しないとブレーキになる (同系 ESC の実測値から始める)
    brake_decel_mps2: 4.0     # ブレーキ帯の減速度上限 ★要実測
    coast_decel_mps2: 0.35    # 惰行時の減速 (転がり抵抗)
  drivetrain_lock:            # 4wd_locked の「突っ張り」★要較正 (小回りでの減速量を実測して合わせる)
    windup_gain: 1.0
    windup_drag: 0.5
  suspension:                 # 準静的なロール/ピッチ。imu_sim の重力投影 (「加速度計側が高いのはロールの重力漏れ」) に効く
    roll_per_ms2: 0.020       # rad / (m/s²)  ≈ 1.1°/(m/s²)  ★要実測
    pitch_per_ms2: 0.012      # rad / (m/s²)  ★要実測
  camera:
    width: 224                # ★凍結値: 実機の取り込み 224×224・15 Hz に合わせた (設計書 較正タブの決定)
    height: 224
    rate_hz: 15.0
    # --- 画角と歪み。★定義元はここ、式は jetracer_common/cam_geom.py (OpenCV plumb_bob)。ラベル・cmd_shaper・camera_info・
    #     OpenCV 描画・Unity (course.json) がすべてここから読む。tools/camera_calib.py の出力をそのまま貼れる形 ---
    # ★2026-09-26 実走画像 (9/12 MEC、10 枚) からの推定 (tools/fit_camera_from_images.py --fix-aspect 1.778 --no-color)。
    #   縦 (高さ・ピッチ・fy) は縦横比を自由にした推定とも一致 (0.145 m・50.7°・fy 66.8) していて信頼できる。
    #   横 (fx) は縦横比を取り込み経路の事実から 1.778 に固定して出した値。**チェッカーボード較正 (tools/camera_calib.py) で置き換える**
    hfov_deg: 143.6           # ピンホール等価の水平画角 (fx 36.8 px)。旧値 120 (仮)
    vfov_deg: 119.4           # fy 65.4 px。fy/fx = 1.78: jetcam 既定 640×480 要求 → Argus mode 4 (1280×720) → 224×224 に潰す
    k1: -0.0017               # 半径方向の歪み (OpenCV の正規化座標 x = X/Z で。k1 < 0 で樽型)。画像からはほぼ 0
    k2: 0.0
    mount_height_m: 0.148     # ★画像から推定 (旧 0.12 仮)。camera_calib.py mount で実測して置き換える
    mount_x_m: 0.0            # base_link (後軸) からの前後位置 ★要実測
    pitch_deg: 50.9           # 下向き正。★画像から推定 (旧 12 仮。実画像は地平線が上から 14%、旧値だと 44%)
    crop_top_frac: 0.0        # 実機は切らない。車体の写り込みは camera_preproc で両系同じマスク
    # --- 実カメラの見た目に寄せる後処理と会場の演出 (Unity のみ。course.json の realism に書き出す) ---
    # 数値の根拠は 2026-09-12 手動走行ログの統計 (tools/make_real_textures.py → StreamingAssets/textures/stats.json):
    # 床 BGR≈(109,112,114)・白壁≈(197,195,192)・赤帯≈(66,70,142)・周辺減光 中心/端≈1.16・柱 列 54-57 / 121-124 (行 209-223)
    realism:
      enable: true
      supersample: 2              # 2 倍で描いて縮小 (実画像の柔らかさと AA)
      # (レンズ歪みは上の camera.k1/k2。realism には持たない)
      vignette: 0.16              # 端で 16 % 暗い
      blur_px: 0.8
      motion_px_per_rad_s: 2.0    # ヨーレート 1 rad/s あたり横 2 px のブラー
      exposure_target: 125        # 自動露出の目標。飽和 (空・白壁) のぶん到達平均は目標の約 0.88 倍 → 実画像の平均 ~110 に合う
      exposure_tau_s: 0.4
      gamma: 1.0
      noise: 0.02
      post_dark: 0.25
      posts: [0.241, 0.259, 0.933, 0.540, 0.558, 0.933]   # 柱 (x0, x1, y0) ×2、画像の正規化座標
      ambient_gain: 1.8           # 環境光の倍率。影側の白・赤の板を実画像の明るさへ (1.0 だと白壁が灰色に沈んだ)
      background_gray: -1         # 負 = Unity 既定のスカイボックス (水色) のまま
      # エピソード乱択化 (/sim/episode の seed で引き直す。幅は暫定・0 で固定)
      episode_light_range: 0.15     # 天井光の強さ ×(1 ± r)
      episode_tint_range: 0.04      # 床・照明の色味 ± r
      episode_ambient_range: 0.15   # 環境光 ×(1 ± r)
      # 床を横切る白テープ。会場ごとに有無・位置が違う (9/12 MEC は完全なコースではない) ので固定では描かず乱択化
      episode_tapes_max: 6          # 走路上のランダムな位置に 0〜N 本 (走路にほぼ直交 ±tape_angle_deg)
      tape_width_m: 0.05
      tape_angle_deg: 10
      tape_len_min_m: 0.6
      tape_len_max_m: 0.9
      start_line_prob: 0.0          # 旧: 規約のスタートラインを確率で描いていた。いまは course.py の START_LINES で常設 (2.56/4.36/6.16 m)
      start_line_x: [2.56, 4.36, 6.16]
      start_line_y0: 0.5
      start_line_y1: 1.9
      # 壁の板はレギュレーション p.24 のとおり 1 枚ごとに赤か白の単色 (配色は course.py の WALL_COLORS)。
      # 色は流用元の値 (2025 車載画像で合わせたもの)。実画像の測定値 (赤 BGR 66,70,141) は露出で暗いので使わない
      wall_white_r: 226
      wall_white_g: 222
      wall_white_b: 212
      wall_red_r: 196
      wall_red_g: 38
      wall_red_b: 36
      carpet_r: 117               # carpet.png が無いときの単色
      carpet_g: 115
      carpet_b: 112
