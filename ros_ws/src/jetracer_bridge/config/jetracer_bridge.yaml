# jetracer_bridge の設定。★要実測 の欄は車体を持ち上げて目で確かめてから入れる (docs/calibration.md)
jetracer_bridge:
  ros__parameters:
    vehicle_profile_file: jetracer_tt02
    i2c:
      bus: 1                    # ★Orin Nano: ピン 27/28 = bus 1、ピン 3/5 = bus 7。i2cdetect -y -r <bus> で 0x40 と 0x68 が見えるほう
      pca9685_addr: 0x40
      imu_addr: 0x68            # ⚠ 同一バス。tegra-i2c のタイムアウトが出たら別バス化を検討 (設計 未決①)
      pca_freq_hz: 50.0
    steering:
      channel: 0
      # ★2026-09-12 の実走ログ (gain −0.55・offset 0.12) から推定。車体を持ち上げて目で確かめて置き換える:
      #   center: 直線区間で運転者が当てていた steering −0.22 → u = 0.241 → 1500 + 750u = 1681 µs が直進
      #   max: steering −1 (左ロック) = 2002 µs、min: steering +1 (右ロック) = 1178 µs。±1 で横加速度が左右ほぼ同じ (0.43/0.47 g) なので、両端で同じ舵角とした
      pulse_us: {min: 1178, center: 1681, max: 2002}
      invert: false
      map: [0.0]                # 較正②の実現率カーブ [δ_rad, µs, ...]。空なら center と min/max の線形
    throttle:
      channel: 1
      pulse_us: {min: 1000, neutral: 1500, max: 2000}  # TBLE-02S の設定手順で合わせた値
      invert: true              # ★実走ログ: 5 セッションとも throttle がマイナス (中央値 −0.11〜−0.13) で前進 = 中立より下のパルスで前進する ESC
      # 下の値は「中立より上 = 前進」の向きで書き、invert で中立を軸に折り返す (実際のパルスは 1500 − (µs − 1500))。
      # ★2026-09-12 の実走ログの周回時間から出した平均車速 (カーブの減速込みなので直線の最高速より低め):
      #   throttle −0.106 → 1.26 m/s、−0.110 → 1.40 (セッションで 1.14〜1.65 とばらつく)、−0.120 → 2.04、−0.130 → 2.45。
      #   0 m/s の点 (1560) と 3.0 m/s の点 (1610) は外挿の仮値。スロットル 0.01 で速度が大きく変わる「不感帯の直上」の領域
      map_v_us: [0.0, 1560.0, 1.26, 1579.5, 1.40, 1582.5, 2.04, 1590.0, 2.45, 1597.5, 3.0, 1610.0]
      reverse_us: 1300
      brake_us: 1350
    failsafe:
      cmd_timeout_ms: 300       # ★既存ブリッジの安全機構を必ず引き継ぐ
      estop_hold_s: 1.0
    publish:
      imu_hz: 100.0
      imu_frame: imu_link
    imu:                        # ★imu_sim.yaml の range / dlpf と一致させる
      accel_g: 4
      gyro_dps: 500
      accel_bw_hz: 92
      gyro_bw_hz: 92
      cov_accel: 0.02
      cov_gyro: 0.0004
    dry_run: false
camera_node:
  ros__parameters:
    vehicle_profile_file: jetracer_tt02
    sensor_id: 0
    sensor_mode: 4
    capture_width: 1280
    capture_height: 720
    capture_fps: 30
    flip_method: 0
    square_mode: crop           # ★meta.txt の「切り出しか縮小か」に合わせる。変えたら hfov_deg も
    source: csi
